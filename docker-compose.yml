# Docker Compose for Surat App
# Network Setup: The 'kinarya-networks' is an external Docker network.
# Create it with: docker network create kinarya-networks

services:
    app:
        build:
            context: .
            dockerfile: docker/Dockerfile
        container_name: 'surat-app'
        image: surat-app:1.0.0
        ports:
            - "8085:8080"
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        environment:
            APP_NAME: 'Manajemen Arsip Digital'
            APP_ENV: local
            APP_KEY: ${APP_KEY:-base64:LVjlDrCIP0TG3FqUQFWDNNe6fGF2CJKwVTTOwCi8coM=}
            APP_DEBUG: true
            APP_URL: http://localhost:8085
            APP_TIMEZONE: "Asia/Jakarta"
            SCOUT_DRIVER: database
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: surat-app
            DB_USERNAME: dev
            DB_PASSWORD: dev
            BROADCAST_DRIVER: log
            CACHE_DRIVER: file
            FILESYSTEM_DISK: local
            QUEUE_CONNECTION: sync
            SESSION_DRIVER: file
            SESSION_LIFETIME: 120
            SESSION_SECURE_COOKIE: false
            SESSION_HTTP_ONLY: true
            SESSION_SAME_SITE: strict
            TZ: 'Asia/Jakarta'
            DEBUGBAR_ENABLED: false
        volumes:
            - surat-app_logs:/var/www/html/storage/logs
            - surat-app_storage:/var/www/html/storage/app
            - surat-app_nginx_logs:/var/log/nginx
        networks:
            - kinarya-networks

volumes:
    surat-app_logs:
        name: "surat-app_logs"
    surat-app_storage:
        name: "surat-app_storage"
    surat-app_nginx_logs:
        name: "surat-app_nginx_logs"

networks:
    kinarya-networks:
        external: true
